# GPU override — opt-in. Gives the licensed container access to NVIDIA GPUs.
# The current image's XGBoost is CPU-only, so this does not enable CUDA training.
# A config requesting surrogate.device=cuda needs surrogate.allow_cpu_fallback=true
# or the request fails. examples/run_navigator.sh --gpu enables that fallback.
#
# Requirements on the host: an NVIDIA driver + the NVIDIA Container Toolkit
# (so `docker run --gpus all` works). Verify with:
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Enable by setting DMC_NAV_GPUS in .env (e.g. DMC_NAV_GPUS=all) — the navigator
# wrapper then layers this file on top of docker-compose.yml automatically.
services:
  navigator:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
